<section class="contato-card">
  <div class="contato-card__header">
    <h2 class="contato-card__title">Conecte-se Comigo</h2>
    <p class="contato-card__subtitle">Aberto a parcerias, soluções de produto e redes profissionais</p>
  </div>

  <div class="contato-card__actions">
    <!-- Botão de Copiar E-mail -->
    <button type="button" class="contato-card__btn contato-card__btn--copy"
      [class.contato-card__btn--copied]="copiado()" (click)="copiarEmail()">
      @if (copiado()) {
      <span>✓ E-mail Copiado!</span>
      } @else {
      <svg class="contato-card__icon" viewBox="0 0 24 24" aria-hidden="true">
        <path
          d="M12 12.713l-11.99-7.713v13.75c0 1.105.895 2 2 2h19.98c1.105 0 2-.895 2-2v-13.75l-11.99 7.713zM12 11l11.99-7.713h-23.98l11.99 7.713z">
        </path>
      </svg>
      <span>E-Mail</span>
      }
    </button>

    <!-- Botão de Alternância de Tema -->
    <button type="button" class="contato-card__btn contato-card__btn--theme" (click)="toggleTema()">
      @if (isDarkMode()) {
      <span>🌙 Modo Escuro</span>
      } @else {
      <span>☀️ Modo Claro</span>
      }
    </button>
  </div>

  <!-- Links de Redes Sociais -->
  <div class="contato-card__social-grid">
    <a [href]="linkedin()" target="_blank" rel="noopener noreferrer" class="contato-card__social-link">
      <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">
        <path
          d="M19 0h-14c-2.76 0-5 2.24-5 5v14c0 2.76 2.24 5 5 5h14c2.76 0 5-2.24 5-5v-14c0-2.76-2.24-5-5-5zm-11 19h-3v-10h3v10zm-1.5-11.27c-.97 0-1.75-.79-1.75-1.76s.78-1.76 1.75-1.76 1.75.79 1.75 1.76-.78 1.76-1.75 1.76zm13.5 11.27h-3v-5.6c0-3.37-4-3.12-4 0v5.6h-3v-10h3v1.77c1.4-2.59 7-2.78 7 2.48v5.75z" />
      </svg>
      <span>LinkedIn</span>
    </a>

    <a [href]="github()" target="_blank" rel="noopener noreferrer" class="contato-card__social-link">
      <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">
        <path
          d="M12 0c-6.63 0-12 5.37-12 12 0 5.3 3.44 9.8 8.2 11.39.6.11.82-.26.82-.58v-2.23c-3.34.73-4.03-1.42-4.03-1.42-.55-1.39-1.34-1.76-1.34-1.76-1.09-.74.08-.73.08-.73 1.2.09 1.84 1.24 1.84 1.24 1.07 1.83 2.81 1.3 3.5 1 .11-.78.42-1.3.76-1.6-2.67-.3-5.47-1.33-5.47-5.93 0-1.31.47-2.38 1.24-3.22-.13-.3-.54-1.52.12-3.18 0 0 1-.32 3.3 1.23a11.5 11.5 0 0 1 6.02 0c2.28-1.55 3.28-1.23 3.28-1.23.66 1.66.25 2.88.12 3.18.77.84 1.24 1.91 1.24 3.22 0 4.61-2.81 5.63-5.48 5.92.43.37.81 1.1.81 2.22v3.29c0 .32.22.7.82.58 4.76-1.59 8.2-6.09 8.2-11.39 0-6.63-5.37-12-12-12z" />
      </svg>
      <span>GitHub</span>
    </a>
  </div>
</section>
