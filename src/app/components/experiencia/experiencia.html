<section class="experiencia-card">
  <div class="experiencia-card__header">
    <h2 class="experiencia-card__title">Experiências Profissionais</h2>
    <span class="experiencia-card__subtitle">Atuação Profissional e Hackathons</span>
  </div>

  <!-- Linha do Tempo Vertical -->
  <div class="timeline">
    @for (item of trajetoria(); track item.id) {
    <div class="timeline__item" [attr.data-tipo]="item.tipo">
      <div class="timeline__marker">
        <span class="timeline__icon">{{ item.icon }}</span>
      </div>

      <div class="timeline__content">
        <span class="timeline__periodo">{{ item.periodo }}</span>
        <h3 class="timeline__titulo">{{ item.titulo }}</h3>
        <span class="timeline__subtitulo">{{ item.subtitulo }}</span>
        <p class="timeline__descricao">{{ item.descricao }}</p>
      </div>
    </div>
    }
  </div>
</section>
